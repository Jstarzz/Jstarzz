name: Update profile PR statistics

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-pr-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Calculate PR statistics
        env:
          PR_STATS_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
        run: python3 scripts/update_pr_stats.py

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo 'Profile counts are already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update PR statistics'
          git push
